[build]
# Netlify Database provides NETLIFY_DB_URL; the build applies Umami's migrations with it.
# The first line lists the names (never the values) of database variables, to diagnose a missing connection string.
command = 'env | cut -d= -f1 | grep -iE "db|database|neon" || true; DATABASE_URL="${DATABASE_URL:-$NETLIFY_DB_URL}" pnpm run build'
publish = ".next"

[build.environment]
NODE_VERSION = "22"
# package.json requires exactly this pnpm (engines.pnpm)
PNPM_VERSION = "12.3.4"

[functions]
included_files = ["node_modules/.geo/**"]

[[plugins]]
package = "@netlify/plugin-nextjs"
