[build]
# Netlify Database provides NETLIFY_DB_URL; the build applies Umami's migrations with it.
command = 'DATABASE_URL="${DATABASE_URL:-$NETLIFY_DB_URL}" pnpm run build'
publish = ".next"

[build.environment]
NODE_VERSION = "22"

[functions]
included_files = ["node_modules/.geo/**"]

[[plugins]]
package = "@netlify/plugin-nextjs"
